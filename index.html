<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SailLingo has moved</title>
    <link rel="canonical" href="https://alarmatwork.github.io/saillingo/" />
    <meta http-equiv="refresh" content="0; url=https://alarmatwork.github.io/saillingo/" />
    <script>
      // keep whatever came after /sailboatparts/ (path, query, hash)
      var rest = location.pathname.replace(/^\/sailboatparts\/?/, '').replace(/^index\.html$/, '');
      location.replace('https://alarmatwork.github.io/saillingo/' + rest + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>This game is now called SailLingo and has moved to
      <a href="https://alarmatwork.github.io/saillingo/">alarmatwork.github.io/saillingo</a>.</p>
  </body>
</html>
